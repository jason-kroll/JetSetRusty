[package]
name = "jetsetrusty"
version = "0.1.0"
edition = "2024"

# Bin crate: no item is reachable outside it, so deny any `pub` — everything
# is pub(crate). The grep-level backstop for pub fields (which this lint does
# not cover) is part of the sweep's verification, not of the build.
[lints.rust]
unreachable_pub = "deny"

[dependencies]
# build-from-source-static: sdl3-sys compiles SDL3 from source and links it
# statically, so no system SDL3 package is needed (Ubuntu/Pop!_OS 24.04 does
# not ship libsdl3-dev) and the binary has no runtime SDL dependency. Costs a
# slower first build; requires cmake + a C compiler.
sdl3 = { version = "0.22", features = ["build-from-source-static"] }

[lints.clippy]
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
unwrap_used = "deny"
